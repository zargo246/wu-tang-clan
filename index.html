<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wu-Tang Name Generator</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <main>
    <h1>Wu-Tang Name Generator</h1>
    <p>Answer these 5 questions to discover your Wu-Tang name.</p>

    <section>
      <label for="firstName">1. What is your first name?</label>
      <input id="firstName" type="text" placeholder="Enter your first name">

      <label for="color">2. What is your favorite color?</label>
      <input id="color" type="text" placeholder="Enter a color">

      <label for="animal">3. What is your favorite animal?</label>
      <input id="animal" type="text" placeholder="Enter an animal">

      <label for="food">4. What is your favorite food?</label>
      <input id="food" type="text" placeholder="Enter a food">

      <label for="number">5. What is your favorite number?</label>
      <input id="number" type="number" placeholder="Enter a number">

      <button id="generateName">Generate My Name</button>
    </section>

    <h2 id="result"></h2>
  </main>

  <script src="/js/main.js"></script>
</body>
</html>
